<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>CoMoH - Aurora &mdash; Acceso Cifrado</title>
<style>
  :root {
    --bg: #090d16;
    --card: rgba(30, 41, 59, 0.88);
    --border: rgba(255, 255, 255, 0.12);
    --accent: #3b82f6;
    --text: #f8fafc;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  body {
    margin: 0; padding: 20px;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #1e293b 0%, #090d16 100%);
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  .auth-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px 24px 26px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.75), 0 0 35px rgba(59, 130, 246, 0.15);
    text-align: center;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    animation: authPop .3s ease-out;
    box-sizing: border-box;
  }
  @keyframes authPop {
    from { opacity: 0; transform: scale(0.92) translateY(12px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .auth-shield {
    width: 60px; height: 60px;
    margin: 0 auto 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(37, 99, 235, 0.45));
    border: 1px solid rgba(96, 165, 250, 0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    box-shadow: 0 0 24px rgba(59, 130, 246, 0.4);
  }
  .auth-title {
    font-size: 20px; font-weight: 700;
    margin: 0 0 4px 0; letter-spacing: -0.01em;
  }
  .auth-badge {
    display: inline-block;
    background: rgba(59, 130, 246, 0.15);
    border: 1px solid rgba(59, 130, 246, 0.4);
    color: #60a5fa;
    padding: 2px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .auth-sub {
    font-size: 12.5px; color: var(--muted);
    margin: 0 0 18px 0; line-height: 1.45;
  }
  .auth-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 14px;
    width: 100%;
  }
  .auth-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
  }
  .auth-input {
    width: 100%;
    background: rgba(15, 23, 42, 0.75);
    border: 1.5px solid rgba(148, 163, 184, 0.35);
    border-radius: 12px;
    padding: 13px 46px 13px 16px;
    font-size: 16px;
    color: #f8fafc;
    outline: none;
    transition: all .15s ease;
    font-family: inherit;
    box-sizing: border-box;
  }
  .auth-input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    background: rgba(15, 23, 42, 0.95);
  }
  .auth-input.error {
    border-color: #ef4444;
    box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25);
    animation: authShake 0.35s ease;
  }
  .auth-input.success {
    border-color: #22c55e;
    box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
  }
  .auth-eye-btn {
    position: absolute;
    right: 8px;
    background: transparent;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    border-radius: 8px;
    transition: color .15s ease;
  }
  .auth-eye-btn:hover {
    color: #f8fafc;
  }
  .auth-submit-btn {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    border: 1px solid rgba(96, 165, 250, 0.4);
    border-radius: 12px;
    padding: 13px 20px;
    font-size: 15px;
    font-weight: 600;
    color: #ffffff;
    cursor: pointer;
    transition: all .15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    min-height: 48px;
    width: 100%;
  }
  .auth-submit-btn:hover {
    background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
  }
  .auth-submit-btn:active {
    transform: scale(0.98);
  }
  .auth-options {
    display: flex; align-items: center; justify-content: center;
    gap: 7px; font-size: 11.5px; color: var(--muted);
    margin-bottom: 8px; cursor: pointer; user-select: none;
  }
  .auth-options input { accent-color: var(--accent); cursor: pointer; }
  .auth-status {
    min-height: 20px; font-size: 12px;
    font-weight: 500; transition: all .2s ease;
    color: var(--muted);
  }
  .auth-status.error {
    color: #f87171;
    animation: authShake 0.35s ease;
  }
  .auth-status.success { color: #4ade80; }
  @keyframes authShake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }
  .loading-spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 5px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 420px) {
    body { padding: 12px; }
    .auth-card { padding: 24px 16px 20px; border-radius: 20px; }
    .auth-shield { width: 50px; height: 50px; font-size: 22px; }
    .auth-title { font-size: 18px; }
  }
</style>
</head>
<body>
  <div class="auth-card" id="authCard">
    <div class="auth-shield">&#128737;</div>
    <div class="auth-title">SuperMobility Fleet</div>
    <div class="auth-badge">&#128274; Cifrado AES-256 de Extremo a Extremo</div>
    <div class="auth-sub">Todos los datos del negocio están protegidos. Ingresa la contraseña de acceso para descifrar en memoria.</div>

    <form id="authForm" class="auth-form" onsubmit="return false;">
      <div class="auth-input-wrap">
        <input type="password" id="authPasswordInput" class="auth-input" 
               placeholder="Ingresa la contraseña" autocomplete="current-password" 
               autocapitalize="none" autocorrect="off" spellcheck="false" required>
        <button type="button" id="btnToggleVisibility" class="auth-eye-btn" title="Mostrar/ocultar contraseña" tabindex="-1">&#128065;</button>
      </div>
      <button type="submit" id="btnSubmitAuth" class="auth-submit-btn">
        <span>Desbloquear</span> <span>&rarr;</span>
      </button>
    </form>

    <label class="auth-options">
      <input type="checkbox" id="authRemember" checked>
      Recordar clave en este dispositivo
    </label>

    <div class="auth-status" id="authStatusText"></div>
  </div>

  <script>
  (function() {
    let isChecking = false;

    const payloadEl = document.getElementById('encryptedPayload');
    const inputEl = document.getElementById('authPasswordInput');
    const formEl = document.getElementById('authForm');
    const eyeBtn = document.getElementById('btnToggleVisibility');
    const statusEl = document.getElementById('authStatusText');
    const rememberCheckbox = document.getElementById('authRemember');

    let payloadData = null;
    try {
      payloadData = JSON.parse(payloadEl.textContent);
    } catch(e) {
      statusEl.textContent = 'Error cargando payload cifrado.';
      return;
    }

    if (eyeBtn && inputEl) {
      eyeBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const isPwd = inputEl.type === 'password';
        inputEl.type = isPwd ? 'text' : 'password';
        eyeBtn.innerHTML = isPwd ? '&#128584;' : '&#128065;';
      });
    }

    function b64ToUint8(str) {
      const binary = atob(str);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function decryptWithPin(enteredPin) {
      const salt = b64ToUint8(payloadData.salt);
      const iv = b64ToUint8(payloadData.iv);
      const cipher = b64ToUint8(payloadData.cipher);

      const pinBytes = new TextEncoder().encode(enteredPin.trim());
      const baseKey = await crypto.subtle.importKey(
        'raw',
        pinBytes,
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );

      const key = await crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: salt,
          iterations: 100000,
          hash: 'SHA-256'
        },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );

      const decryptedBuf = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv, tagLength: 128 },
        key,
        cipher
      );

      return new TextDecoder().decode(decryptedBuf);
    }

    async function tryUnlock(pinCandidate, isAuto) {
      if (isChecking) return;
      isChecking = true;
      statusEl.innerHTML = '<span class="loading-spinner"></span> Descifrando datos seguros...';
      statusEl.className = 'auth-status';
      if (inputEl) inputEl.className = 'auth-input';

      try {
        const html = await decryptWithPin(pinCandidate);
        if (inputEl) inputEl.className = 'auth-input success';
        statusEl.textContent = '✔ Descifrado exitoso. Abriendo...';
        statusEl.className = 'auth-status success';

        const shouldRemember = rememberCheckbox ? rememberCheckbox.checked : true;
        try {
          if (shouldRemember) {
            localStorage.setItem('sm_aes_pin', pinCandidate);
          } else {
            sessionStorage.setItem('sm_aes_pin', pinCandidate);
          }
          const hashBuf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pinCandidate.trim()));
          const hashHex = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
          if (shouldRemember) {
            localStorage.setItem('sm_fleet_auth', hashHex);
          } else {
            sessionStorage.setItem('sm_fleet_auth', hashHex);
          }
        } catch(e) {}

        setTimeout(() => {
          document.open();
          document.write(html);
          document.close();
        }, isAuto ? 10 : 200);
      } catch(err) {
        if (inputEl) inputEl.className = 'auth-input error';
        statusEl.textContent = '❌ Contraseña incorrecta. Intenta de nuevo.';
        statusEl.className = 'auth-status error';
        if (isAuto) {
          try {
            localStorage.removeItem('sm_aes_pin');
            sessionStorage.removeItem('sm_aes_pin');
            localStorage.removeItem('sm_fleet_auth');
            sessionStorage.removeItem('sm_fleet_auth');
          } catch(e) {}
        }
        setTimeout(() => {
          isChecking = false;
          if (inputEl) {
            inputEl.value = '';
            inputEl.focus();
          }
        }, 750);
      }
    }

    if (formEl) {
      formEl.addEventListener('submit', (e) => {
        e.preventDefault();
        const val = inputEl ? inputEl.value : '';
        if (!val) return;
        tryUnlock(val, false);
      });
    }

    // Auto-focus on desktop
    if (inputEl && window.innerWidth > 600) {
      setTimeout(() => { try { inputEl.focus(); } catch(e) {} }, 300);
    }

    // Auto-desbloqueo si la clave fue recordada
    try {
      const savedPin = localStorage.getItem('sm_aes_pin') || sessionStorage.getItem('sm_aes_pin');
      if (savedPin) {
        tryUnlock(savedPin, true);
      }
    } catch(e) {}
  })();
  </script>
